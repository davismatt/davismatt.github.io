<!DOCTYPE html>
<!--
  Template for the 1200x630 link-preview image (og-image.png).
  scripts/prerender.sh screenshots this page at deploy time, then deletes it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        font-family: 'Open Sans', sans-serif;
        display: flex;
        background: #ffffff;
      }
      .side {
        width: 300px;
        background: rgb(41,42,45);
        flex-shrink: 0;
      }
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
      }
      .top_bar {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 34px;
        background: rgb(41,42,45);
      }
      .subtext {
        margin: 0 60px 22px 0;
        text-align: right;
        font-weight: 300;
        font-size: 24px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #222222;
      }
      .name {
        margin-left: -90px;
        padding: 0 0 0 70px;
        height: 190px;
        line-height: 190px;
        background: rgb(140,144,153);
        color: #fefefe;
        font-size: 92px;
        font-weight: 400;
        letter-spacing: 5px;
      }
      .skills {
        margin: 34px 60px 0 0;
        text-align: right;
        font-size: 26px;
        color: #444444;
      }
      .skills span { color: rgb(238,129,120); padding: 0 6px; }
      .url {
        position: absolute;
        bottom: 34px; right: 60px;
        font-size: 22px;
        font-weight: 600;
        color: rgb(12,161,211);
      }
    </style>
  </head>
  <body>
    <div class="side"></div>
    <div class="main">
      <div class="top_bar"></div>
      <div class="subtext">// Full Stack Engineer</div>
      <div class="name">Matthew Davis</div>
      <div class="skills">Ruby on Rails<span>·</span>TypeScript<span>·</span>React<span>·</span>Node.js</div>
      <div class="url">davismatt.github.io</div>
    </div>
  </body>
</html>
